<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Список дел</title>
    <style>
      body {
        font:
          16px/1.5 system-ui,
          sans-serif;
        background: #f4f4f6;
        margin: 0;
      }
      main {
        max-width: 520px;
        margin: 48px auto;
        background: #fff;
        padding: 24px;
        border-radius: 16px;
      }
      form {
        display: flex;
        gap: 8px;
      }
      input[type='text'] {
        flex: 1;
        padding: 10px 12px;
        border: 1px solid #ccc;
        border-radius: 10px;
      }
      button {
        padding: 10px 14px;
        border: 0;
        border-radius: 10px;
        background: #6c4bf0;
        color: #fff;
        cursor: pointer;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px solid #eee;
      }
      li.done span {
        text-decoration: line-through;
        color: #999;
      }
      #clear {
        background: #eee;
        color: #333;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Список дел</h1>
      <form id="form"><input id="title" type="text" placeholder="Что сделать?" /><button>Добавить</button></form>
      <ul id="list"></ul>
      <button id="clear">Убрать выполненные</button>
    </main>
    <script type="module">
      import { addTodo, toggle, clearDone } from './todo.js';
      let todos = [
        { title: 'Купить хлеб', done: true },
        { title: 'Позвонить маме', done: false },
      ];
      const list = document.getElementById('list');
      const render = () => {
        list.innerHTML = '';
        todos.forEach((t, i) => {
          const li = document.createElement('li');
          li.className = t.done ? 'done' : '';
          li.innerHTML = `<input type="checkbox" ${t.done ? 'checked' : ''} /><span></span>`;
          li.querySelector('span').textContent = t.title;
          li.querySelector('input').onchange = () => {
            todos = toggle(todos, i);
            render();
          };
          list.append(li);
        });
      };
      document.getElementById('form').onsubmit = (e) => {
        e.preventDefault();
        const input = document.getElementById('title');
        todos = addTodo(todos, input.value);
        input.value = '';
        render();
      };
      document.getElementById('clear').onclick = () => {
        todos = clearDone(todos);
        render();
      };
      render();
    </script>
  </body>
</html>
